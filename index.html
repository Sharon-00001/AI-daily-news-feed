<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>信息聚合 Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #888;
      font-size: 0.9rem;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .refresh-btn {
      background: #1a1a2e;
      border: 1px solid #333;
      color: #888;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }

    .loading {
      text-align: center;
      padding: 60px 0;
      color: #888;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      background: #1a1018;
      border: 1px solid #ff4444;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      color: #ff6666;
    }

    .category {
      margin-bottom: 40px;
    }

    .category h2 {
      font-size: 1rem;
      color: #fff;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-icon {
      font-size: 1.1rem;
    }

    .source-tag {
      font-size: 0.7rem;
      color: #666;
      margin-left: auto;
      font-weight: normal;
    }

    .video-list, .article-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      background: #161616;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 14px 16px;
      transition: all 0.2s;
    }

    .item:hover {
      border-color: #444;
      transform: translateY(-1px);
    }

    .item a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .item-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: #fff;
      margin-bottom: 6px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.75rem;
      color: #888;
      flex-wrap: wrap;
    }

    .item-source {
      color: #667eea;
    }

    .item-time {
      margin-left: auto;
    }

    .view-on-source {
      color: #555;
      font-size: 0.7rem;
    }

    .last-updated {
      text-align: center;
      color: #555;
      font-size: 0.75rem;
      margin-top: 40px;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 0;
    }

    @media (max-width: 600px) {
      .news-grid {
        grid-template-columns: 1fr;
      }
      .item-meta {
        gap: 8px;
      }
      .item-time {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-row">
        <div>
          <h1>全球资讯聚合</h1>
          <p class="subtitle" id="currentDate"></p>
        </div>
        <button class="refresh-btn" onclick="fetchAllFeeds()">刷新</button>
      </div>
    </header>

    <div id="app">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>正在加载最新资讯...</p>
      </div>
    </div>

    <p class="last-updated" id="lastUpdated"></p>
  </div>

  <script>
    const CORS_PROXIES = [
      'https://api.allorigins.win/raw?url=',
      'https://corsproxy.io/?',
      'https://api.codetabs.com/v1/proxy?quest='
    ];
    let currentProxyIndex = 0;

    function getProxy() {
      return CORS_PROXIES[currentProxyIndex];
    }

    function rotateProxy() {
      currentProxyIndex = (currentProxyIndex + 1) % CORS_PROXIES.length;
    }

    const feeds = [
      {
        name: 'BBC World News',
        icon: '🌍',
        source: 'BBC',
        feedUrl: 'https://feeds.bbci.co.uk/news/world/rss.xml',
        displayLimit: 6
      },
      {
        name: 'Reuters World',
        icon: '📰',
        source: 'Reuters',
        feedUrl: 'https://www.reutersagency.com/feed/',
        displayLimit: 6
      },
      {
        name: 'Hacker News',
        icon: '💻',
        source: 'HN',
        feedUrl: 'https://hnrss.org/frontpage',
        displayLimit: 8
      },
      {
        name: 'TechCrunch',
        icon: '🚀',
        source: 'TC',
        feedUrl: 'https://techcrunch.com/feed/',
        displayLimit: 6
      },
      {
        name: 'Reddit ML',
        icon: '🤖',
        source: 'Reddit',
        feedUrl: 'https://www.reddit.com/r/MachineLearning.rss',
        displayLimit: 6
      }
    ];

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);

      if (isNaN(date.getTime())) return dateStr;
      if (diffMins < 60) return `${diffMins} 分钟前`;
      if (diffHours < 24) return `${diffHours} 小时前`;
      if (diffDays < 7) return `${diffDays} 天前`;
      return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
    }

    function parseRSS(xmlText, source) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, 'text/xml');
      const entries = xml.querySelectorAll('entry');

      const items = [];
      entries.forEach(entry => {
        let title = '';
        let link = '';
        let published = '';
        let content = '';

        const titleEl = entry.querySelector('title') || entry.querySelector('h2');
        if (titleEl) title = titleEl.textContent || '';

        const linkEl = entry.querySelector('link');
        if (linkEl) link = linkEl.getAttribute('href') || '';

        const publishedEl = entry.querySelector('published') || entry.querySelector('updated');
        if (publishedEl) published = publishedEl.textContent || '';

        const contentEl = entry.querySelector('content');
        if (contentEl) content = contentEl.textContent || '';

        if (title && link) {
          items.push({
            title: title.replace(/<[^>]*>/g, '').trim(),
            link: link.startsWith('http') ? link : '',
            published,
            source: source
          });
        }
      });

      // Fallback for RSS that uses item elements
      if (items.length === 0) {
        const items2 = xml.querySelectorAll('item');
        items2.forEach(item => {
          const title = item.querySelector('title')?.textContent || '';
          const link = item.querySelector('link')?.textContent || '';
          const pubDate = item.querySelector('pubDate')?.textContent || '';
          if (title) {
            items.push({
              title: title.replace(/<[^>]*>/g, '').trim(),
              link: link.startsWith('http') ? link : '',
              published: pubDate,
              source: source
            });
          }
        });
      }

      return items;
    }

    async function fetchWithProxy(feed, maxRetries = 2) {
      for (let attempt = 0; attempt < maxRetries; attempt++) {
        try {
          const proxy = getProxy();
          const url = proxy + encodeURIComponent(feed.feedUrl);
          const response = await fetch(url, { timeout: 15000 });
          if (!response.ok) throw new Error('Fetch failed');
          const text = await response.text();
          return parseRSS(text, feed.source);
        } catch (error) {
          console.warn(`Failed ${feed.name}:`, error);
          rotateProxy();
        }
      }
      return [];
    }

    async function fetchAllFeeds() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>正在加载最新资讯...</p>
        </div>
      `;

      const results = await Promise.all(
        feeds.map(feed =>
          fetchWithProxy(feed).then(items => ({ ...feed, items }))
        )
      );

      const validResults = results.filter(r => r.items.length > 0);

      if (validResults.length === 0) {
        app.innerHTML = `
          <div class="error">
            加载失败，可能是网络问题。<br>
            请检查网络后点击右上角「刷新」重试。
          </div>
        `;
        return;
      }

      let html = '<div class="news-grid">';

      validResults.forEach(feed => {
        html += `
          <div class="category">
            <h2>
              <span class="category-icon">${feed.icon}</span>
              ${feed.name}
              <span class="source-tag">${feed.source}</span>
            </h2>
            <div class="article-list">
        `;

        feed.items.slice(0, feed.displayLimit).forEach(item => {
          const displayLink = item.link || feed.feedUrl;
          html += `
            <div class="item">
              <a href="${displayLink}" target="_blank" rel="noopener">
                <div class="item-title">${item.title}</div>
                <div class="item-meta">
                  <span class="item-time">${formatDate(item.published)}</span>
                  <span class="view-on-source">→ 查看原文</span>
                </div>
              </a>
            </div>
          `;
        });

        html += '</div></div>';
      });

      html += '</div>';
      app.innerHTML = html;

      const now = new Date();
      document.getElementById('lastUpdated').textContent =
        `最后更新: ${now.toLocaleString('zh-CN')}`;
    }

    document.getElementById('currentDate').textContent =
      new Date().toLocaleDateString('zh-CN', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

    fetchAllFeeds();
  </script>
</body>
</html>
